[package]
name = "eth-spec-diff"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Semantic diff viewer for Ethereum execution specs"

[[bin]]
name = "eth-spec-diff"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.24"
tree-sitter-python = "0.23"
similar = "2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
